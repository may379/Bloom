version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: bloom_blossom_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bloom
      POSTGRES_PASSWORD: bloom_secret
      POSTGRES_DB: bloom_blossom
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bloom -d bloom_blossom']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bloom_blossom_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bloom:bloom_secret@db:5432/bloom_blossom
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: docker-secret-change-in-production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - '3000:3000'

volumes:
  postgres_data:
